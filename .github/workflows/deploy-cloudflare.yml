name: 发布工厂资料库到 Cloudflare
# DNS verification follow-up: re-check the custom domain after DNS changes.

on:
  push:
    branches: [main]
    paths:
      - "yourz-runtime.tar.xz"
      - ".github/workflows/deploy-cloudflare.yml"
      - "deploy-fixes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 检查并发布网站
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOOTSTRAP_ADMIN_USER: ${{ secrets.BOOTSTRAP_ADMIN_USER }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      PROJECT_NAME: yourz-website
      DATABASE_NAME: yourz-factory-db

    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查必要的部署密钥
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::缺少 CLOUDFLARE_API_TOKEN，请在 GitHub 密钥设置中添加。"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::缺少 CLOUDFLARE_ACCOUNT_ID，请在 GitHub 密钥设置中添加。"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_USER" || { echo "::error::缺少 BOOTSTRAP_ADMIN_USER，请先添加初始管理员用户名。"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_PASSWORD" || { echo "::error::缺少 BOOTSTRAP_ADMIN_PASSWORD，请先添加初始管理员密码。"; exit 1; }

      - name: 自动诊断 Cloudflare 令牌和目标账户
        shell: bash
        run: |
          set -euo pipefail
          echo "正在检查令牌状态（不会输出令牌内容）……"
          VERIFY_HTTP="$(curl --silent --show-error --output /tmp/cf-verify.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node - "$VERIFY_HTTP" /tmp/cf-verify.json <<'NODE'
          const fs = require('node:fs');
          const http = process.argv[2];
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const active = http === '200' && body.success === true && body.result?.status === 'active';
          console.log(active ? '令牌状态：有效（active）。' : '令牌状态：未通过验证。');
          if (!active) {
            console.log('HTTP 状态：' + http);
            for (const e of (body.errors || [])) console.log('Cloudflare 错误：' + (e.code ?? '未知') + ' ' + String(e.message || '').replace(/[\\r\\n]/g, ' '));
            process.exit(1);
          }
          NODE

          echo "正在检查此令牌能否访问配置的 D1 账户……"
          ACCOUNT_HTTP="$(curl --silent --show-error --output /tmp/cf-d1-access.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1")"
          node - "$ACCOUNT_HTTP" /tmp/cf-d1-access.json <<'NODE'
          const fs = require('node:fs');
          const http = process.argv[2];
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const allowed = http === '200' && body.success === true;
          console.log(allowed ? 'D1 账户访问：通过。' : 'D1 账户访问：失败。');
          if (!allowed) {
            console.log('HTTP 状态：' + http);
            for (const e of (body.errors || [])) console.log('Cloudflare 错误：' + (e.code ?? '未知') + ' ' + String(e.message || '').replace(/[\\r\\n]/g, ' '));
            console.log('排查方向：账户编号与令牌权限范围不匹配，或令牌没有目标账户的 D1 权限。');
            process.exit(1);
          }
          NODE
          rm -f /tmp/cf-verify.json /tmp/cf-d1-access.json

      - name: 校验并解压网站程序
        shell: bash
        run: |
          set -euo pipefail
          echo "a67d49b9fe80fa901b113eb29541609d2c19c543e459ae758de3e2267ef9b15c  yourz-runtime.tar.xz" | sha256sum -c -
          mkdir -p app
          tar -xJf yourz-runtime.tar.xz -C app
          node deploy-fixes/enable-admin-diagnostics.mjs app/src/handler.js
          node deploy-fixes/enable-public-entry.mjs app
          cd app
          npm run check
          node test-worker.mjs

      - name: 安装 Cloudflare 部署工具
        run: npm install --global wrangler@4

      - name: 创建或查找共享数据库
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 list --json > /tmp/d1-list.json

          find_db_id() {
            node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const find = value => {
                  if (Array.isArray(value)) {
                    for (const item of value) { const found = find(item); if (found) return found; }
                  } else if (value && typeof value === "object") {
                    if (value.name === process.env.DATABASE_NAME || value.database_name === process.env.DATABASE_NAME) {
                      const id = value.uuid || value.database_id || value.id;
                      if (id) return id;
                    }
                    for (const item of Object.values(value)) { const found = find(item); if (found) return found; }
                  }
                  return "";
                };
                process.stdout.write(String(find(JSON.parse(raw)) || ""));
              });
            '
          }

          DB_ID="$(find_db_id < /tmp/d1-list.json)"
          if [ -z "$DB_ID" ]; then
            wrangler d1 create "$DATABASE_NAME" --location apac
            wrangler d1 list --json > /tmp/d1-list.json
            DB_ID="$(find_db_id < /tmp/d1-list.json)"
          fi
          test -n "$DB_ID" || { echo "::error::无法取得共享数据库编号，未继续发布。"; exit 1; }
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "已找到或创建共享数据库。"

      - name: 创建或查找网站项目
        shell: bash
        run: |
          set -euo pipefail
          set +e
          CREATE_OUTPUT="$(wrangler pages project create "$PROJECT_NAME" --production-branch main 2>&1)"
          CREATE_STATUS=$?
          set -e
          if [ "$CREATE_STATUS" -eq 0 ]; then
            echo "$CREATE_OUTPUT"
          elif printf '%s' "$CREATE_OUTPUT" | grep -Eqi 'already exists|8000002'; then
            echo "网站项目已存在，继续部署。"
          else
            echo "$CREATE_OUTPUT"
            exit "$CREATE_STATUS"
          fi

      - name: 写入数据库绑定配置
        shell: bash
        run: |
          cat > app/wrangler.toml <<EOF
          name = "yourz-website"
          pages_build_output_dir = "./public"
          compatibility_date = "2026-10-11"
          compatibility_flags = ["nodejs_compat"]
          send_metrics = false

          [[d1_databases]]
          binding = "DB"
          database_name = "yourz-factory-db"
          database_id = "$DB_ID"
          EOF

      - name: 设置初始管理员
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");fs.writeFileSync("/tmp/yourz-secrets.json",JSON.stringify({BOOTSTRAP_ADMIN_USER:process.env.BOOTSTRAP_ADMIN_USER,BOOTSTRAP_ADMIN_PASSWORD:process.env.BOOTSTRAP_ADMIN_PASSWORD}));'
          wrangler pages secret bulk /tmp/yourz-secrets.json --project-name "$PROJECT_NAME"
          rm -f /tmp/yourz-secrets.json

      - name: 发布网站
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          wrangler pages deploy ./public --project-name "$PROJECT_NAME" --branch main 2>&1 | tee /tmp/yourz-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9-]+\.yourz-website\.pages\.dev' /tmp/yourz-deploy.log | tail -n 1)"
          test -n "$DEPLOY_URL" || { echo "::error::无法从部署日志读取本次部署地址。"; exit 1; }
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "本次部署地址：$DEPLOY_URL"

      - name: 自动绑定正式域名 yourz.top
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="yourz.top"
          LIST_HTTP="$(curl --silent --show-error --output /tmp/pages-domains.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains")"
          if [ "$LIST_HTTP" != "200" ]; then
            echo "::error::查询 Pages 自定义域名失败，HTTP $LIST_HTTP。"
            node -e 'const b=require("/tmp/pages-domains.json");for(const e of b.errors||[])console.log(String(e.code)+": "+String(e.message||""));'
            exit 1
          fi
          EXISTS="$(node -e '
            const fs=require("node:fs");
            const body=JSON.parse(fs.readFileSync("/tmp/pages-domains.json","utf8"));
            const find=(value)=> {
              if(Array.isArray(value)) return value.some(find);
              if(value && typeof value==="object") {
                if(value.name==="yourz.top" || value.domain==="yourz.top") return true;
                return Object.values(value).some(find);
              }
              return false;
            };
            if(body.success!==true) process.exit(2);
            process.stdout.write(find(body.result) ? "yes" : "no");
          ')"
          if [ "$EXISTS" = "yes" ]; then
            echo "正式域名 yourz.top 已绑定到 Pages 项目。"
          else
            POST_HTTP="$(curl --silent --show-error --output /tmp/pages-domain-add.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"yourz.top"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains")"
            node -e '
              const fs=require("node:fs");
              const http=process.argv[1];
              const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
              if ((http==="200" || http==="201") && body.success===true) {
                console.log("Cloudflare Pages 已接受 yourz.top 域名绑定申请。");
                console.log("域名验证状态："+String(body.result?.status || body.result?.verification_data?.status || "处理中"));
                process.exit(0);
              }
              console.log("绑定申请未成功，HTTP "+http);
              for(const e of body.errors||[]) console.log(String(e.code??"未知")+": "+String(e.message||""));
              process.exit(1);
            ' "$POST_HTTP" /tmp/pages-domain-add.json
          fi
          rm -f /tmp/pages-domains.json /tmp/pages-domain-add.json

      - name: 自动补齐 Pages 所需 CNAME 记录
        shell: bash
        run: |
          set +e
          DOMAIN_HTTP="$(curl --silent --show-error --output /tmp/pages-domain-for-dns.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains/yourz.top")"
          ZONE_ID=""
          if [ "$DOMAIN_HTTP" = "200" ]; then
            ZONE_ID="$(node -e 'const b=require("/tmp/pages-domain-for-dns.json");process.stdout.write(String(b.result?.zone_tag||b.result?.zone_id||""))')"
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "未能从 Pages API 取得 DNS 区域编号，暂时无法自动添加 CNAME。"
          else
            REC_HTTP="$(curl --silent --show-error --output /tmp/yourz-dns-records.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=yourz.top")"
            if [ "$REC_HTTP" != "200" ]; then
              echo "自动读取 DNS 记录失败，HTTP $REC_HTTP；可能需要 Zone DNS 权限。"
              node -e 'const b=require("/tmp/yourz-dns-records.json");for(const e of b.errors||[])console.log(String(e.code??"未知")+": "+String(e.message||""))'
            else
              EXISTING="$(node -e '
                const b=require("/tmp/yourz-dns-records.json");
                const rs=b.result||[];
                const same=rs.find(r=>r.type==="CNAME" && r.name==="yourz.top" && String(r.content).replace(/\.$/,"").toLowerCase()==="yourz-website.pages.dev");
                const conflicts=rs.filter(r=>r.name==="yourz.top" && ["A","AAAA","CNAME"].includes(r.type));
                if(same) process.stdout.write("correct");
                else if(conflicts.length) process.stdout.write("conflict");
                else process.stdout.write("missing");
              ')"
              if [ "$EXISTING" = "correct" ]; then
                echo "正确的 CNAME 记录已经存在。"
              elif [ "$EXISTING" = "conflict" ]; then
                echo "根域名已有不同的 A/AAAA/CNAME 记录，为防止覆盖现有配置，本次没有修改。"
              else
                POST_HTTP="$(curl --silent --show-error --output /tmp/yourz-dns-create.json --write-out '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"type":"CNAME","name":"yourz.top","content":"yourz-website.pages.dev","ttl":1,"proxied":false}' "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")"
                node -e '
                  const fs=require("node:fs"), http=process.argv[1], b=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
                  if((http==="200"||http==="201")&&b.success===true) console.log("已自动创建 DNS CNAME：yourz.top -> yourz-website.pages.dev（DNS Only，供 Pages 完成验证）。");
                  else { console.log("无法自动创建 CNAME，HTTP "+http); for(const e of b.errors||[])console.log(String(e.code??"未知")+": "+String(e.message||"")); console.log("通常是当前 API 令牌缺少 Zone DNS Edit 权限。"); }
                ' "$POST_HTTP" /tmp/yourz-dns-create.json
              fi
            fi
          fi
          rm -f /tmp/pages-domain-for-dns.json /tmp/yourz-dns-records.json /tmp/yourz-dns-create.json
          set -e

      - name: 检查正式域名状态与 DNS 解析
        shell: bash
        run: |
          set +e
          DOMAIN_HTTP="$(curl --silent --show-error --output /tmp/pages-domain-status.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains/yourz.top")"
          node -e '
            const fs=require("node:fs");
            const http=process.argv[1];
            const b=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            console.log("Pages 域名接口 HTTP："+http);
            if(b.success && b.result) {
              console.log("Pages 域名状态："+String(b.result.status||"未知"));
              console.log("验证状态："+String(b.result.validation_data?.status||b.result.verification_data?.status||"未知"));
              if(b.result.validation_data?.error_message) console.log("验证提示："+String(b.result.validation_data.error_message).slice(0,300));
              if(b.result.verification_data?.error_message) console.log("证书验证提示："+String(b.result.verification_data.error_message).slice(0,300));
            } else for(const e of b.errors||[]) console.log("Pages 查询错误："+String(e.code??"未知")+" "+String(e.message||""));
          ' "$DOMAIN_HTTP" /tmp/pages-domain-status.json

          echo "检查公开 DNS（Google DNS）："
          for TYPE in NS A CNAME; do
            curl --silent --show-error --max-time 15 "https://dns.google/resolve?name=yourz.top&type=$TYPE" -o "/tmp/dns-$TYPE.json"
            node -e '
              const fs=require("node:fs");
              const type=process.argv[1], f="/tmp/dns-"+type+".json";
              try {
                const b=JSON.parse(fs.readFileSync(f,"utf8"));
                console.log(type+" DNS 状态："+String(b.Status));
                for(const a of b.Answer||[]) console.log("  "+a.name+" -> "+a.data);
              } catch(e) { console.log(type+" DNS 查询暂不可用："+e.message); }
            ' "$TYPE"
          done

          echo "检查 Cloudflare 区域与 DNS 记录权限："
          ZONE_HTTP="$(curl --silent --show-error --output /tmp/zone-yourz.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=yourz.top")"
          echo "区域查询 HTTP：$ZONE_HTTP"
          if [ "$ZONE_HTTP" = "200" ]; then
            ZONE_ID="$(node -e 'const b=require("/tmp/zone-yourz.json");process.stdout.write(b.result?.[0]?.id||"")')"
            if [ -n "$ZONE_ID" ]; then
              DNS_HTTP="$(curl --silent --show-error --output /tmp/dns-records-yourz.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=yourz.top")"
              echo "DNS 记录查询 HTTP：$DNS_HTTP"
              if [ "$DNS_HTTP" = "200" ]; then
                node -e 'const b=require("/tmp/dns-records-yourz.json");for(const r of b.result||[])console.log(r.type+" "+r.name+" -> "+r.content+" (proxied="+String(r.proxied)+")")'
              else
                node -e 'const b=require("/tmp/dns-records-yourz.json");for(const e of b.errors||[])console.log(String(e.code??"未知")+": "+String(e.message||""))'
              fi
            else
              echo "Cloudflare 区域查询没有返回 zone ID。"
            fi
          else
            node -e 'const b=require("/tmp/zone-yourz.json");for(const e of b.errors||[])console.log(String(e.code??"未知")+": "+String(e.message||""))'
            echo "当前自动化令牌可能没有读取 DNS 区域的权限。"
          fi
          rm -f /tmp/pages-domain-status.json /tmp/dns-NS.json /tmp/dns-A.json /tmp/dns-CNAME.json /tmp/zone-yourz.json /tmp/dns-records-yourz.json
          set -e

      - name: 线上真实写入测试并清理测试资料
        shell: bash
        env:
          DEPLOY_URL: https://yourz-website.pages.dev
        run: node deploy-fixes/smoke-live-save.mjs

      - name: 显示部署提示
        run: echo "部署及线上数据库写入检查已执行。"
