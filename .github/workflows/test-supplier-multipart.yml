name: Validate supplier large-file multipart upload

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main, fix/supplier-large-file-multipart]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/test-supplier-multipart.yml"
      - "yourz-runtime.tar.xz"
      - "deploy-fixes/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify runtime archive and build production-equivalent package
        shell: bash
        run: |
          set -euo pipefail
          echo "a67d49b9fe80fa901b113eb29541609d2c19c543e459ae758de3e2267ef9b15c  yourz-runtime.tar.xz" | sha256sum -c -
          mkdir -p app
          tar -xJf yourz-runtime.tar.xz -C app
          node deploy-fixes/enable-admin-diagnostics.mjs app/src/handler.js
          node deploy-fixes/enable-public-entry.mjs app
          node deploy-fixes/add-yourz-favicon.mjs app
          node --check .github/scripts/fix-chinese-ime.mjs
          node .github/scripts/fix-chinese-ime.mjs app/public/app.js
          npm install --prefix app --no-save --package-lock=false jszip@3.10.1
          node .github/scripts/fix-load-latest.mjs app
          node .github/scripts/add-supplier-quote-archive.mjs app
          node .github/scripts/add-r2-multipart-10gb.mjs app
          node --check .github/scripts/fix-supplier-multipart-upload.mjs
          node .github/scripts/fix-supplier-multipart-upload.mjs app
          cd app
          npm run check
          node test-worker.mjs
          node ../.github/scripts/test-supplier-multipart-upload.mjs .
          node --check src/handler.js
          node --check public/app.js
          grep -q "YOURZ_R2_MULTIPART_10GB_V1" public/app.js
          grep -q "YOURZ_SUPPLIER_MULTIPART_UPLOAD_V1" public/app.js
          grep -q "YOURZ_SUPPLIER_MULTIPART_UPLOAD_V1" src/handler.js
          ! grep -q "file.size>20\*1024\*1024" public/app.js
          grep -q "MAX_TOTAL_PRODUCT_FILE_BYTES = 20_000_000_000" src/handler.js
          echo "PASS: supplier quote uploads use R2 multipart chunks and keep the 20 GB shared quota; no 20 MB client-side cap remains."
