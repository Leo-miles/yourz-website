name: YOURZ Refresh-Only Production Publish

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/fix-load-latest.mjs"
      - ".github/scripts/fix-upload-limit-90mb.mjs"
      - ".github/workflows/deploy-refresh-only.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yourz-refresh-only-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish only the tested refresh-module change
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: yourz-website
      DATABASE_NAME: yourz-factory-db
      R2_BUCKET_NAME: yourz-product-files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare token and account access (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN; deployment stopped."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID; deployment stopped."; exit 1; }

          VERIFY_HTTP="$(curl --silent --show-error --max-time 20 --output /tmp/cf-verify.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          node - "$VERIFY_HTTP" /tmp/cf-verify.json <<'NODE'
          const fs = require('node:fs');
          const http = process.argv[2];
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (http !== '200' || body.success !== true || body.result?.status !== 'active') {
            console.error('Cloudflare token verification failed; no deployment attempted.');
            process.exit(1);
          }
          console.log('Cloudflare token verified.');
          NODE

          ACCOUNT_HTTP="$(curl --silent --show-error --max-time 20 --output /tmp/cf-d1-access.json --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
          node - "$ACCOUNT_HTTP" /tmp/cf-d1-access.json <<'NODE'
          const fs = require('node:fs');
          const http = process.argv[2];
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (http !== '200' || body.success !== true) {
            console.error('Cloudflare D1 account access check failed; no deployment attempted.');
            process.exit(1);
          }
          console.log('Cloudflare account/D1 access verified.');
          NODE
          rm -f /tmp/cf-verify.json /tmp/cf-d1-access.json

      - name: Build current production package and patch only refresh behavior
        shell: bash
        run: |
          set -euo pipefail
          echo "a67d49b9fe80fa901b113eb29541609d2c19c543e459ae758de3e2267ef9b15c  yourz-runtime.tar.xz" | sha256sum -c -
          node --check .github/scripts/fix-load-latest.mjs
          mkdir -p app
          tar -xJf yourz-runtime.tar.xz -C app

          # The file-preview archive parser is vendored locally; install it only in the temporary build workspace.
          npm install --prefix app --no-save --package-lock=false jszip@3.10.1

          # Preserve the exact production transformations already used by the existing pipeline.
          node deploy-fixes/enable-admin-diagnostics.mjs app/src/handler.js
          node deploy-fixes/enable-public-entry.mjs app
          node deploy-fixes/add-yourz-favicon.mjs app

          # This build applies the refresh, safe supplier JSON import, and shared product-file library patches; it contains no unrelated cloud-drive/audit changes.
          node .github/scripts/fix-load-latest.mjs app
          node --check .github/scripts/add-supplier-quote-archive.mjs
          node .github/scripts/add-supplier-quote-archive.mjs app
          node --check .github/scripts/add-r2-multipart-10gb.mjs
          node .github/scripts/add-r2-multipart-10gb.mjs app
          node --check app/public/app.js
          cd app
          npm run check
          node test-worker.mjs
          test -f public/vendor/jszip.min.js
          grep -q "YOURZ_SUPPLIER_QUOTE_ARCHIVE_V1" public/app.js
          grep -q "YOURZ_XLSX_INLINE_IMAGE_PREVIEW_V1" public/app.js
          grep -q "multipart-nofilecap=20261026-1" public/index.html
          grep -q "YOURZ_R2_MULTIPART_10GB_V1" public/app.js
          grep -q "MAX_SINGLE_PRODUCT_FILE_BYTES = 20 \\* 1024 \\* 1024" src/handler.js
          grep -q "MAX_TOTAL_PRODUCT_FILE_BYTES = 20_000_000_000" src/handler.js

      - name: Install Cloudflare deployment tool
        run: npm install --global wrangler@4

      - name: Find the existing production D1 database (never create or reset it)
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 list --json > /tmp/d1-list.json
          DB_ID="$(node - /tmp/d1-list.json "$DATABASE_NAME" <<'NODE'
          const fs = require('node:fs');
          const all = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const target = process.argv[3];
          const walk = value => {
            if (Array.isArray(value)) {
              for (const item of value) { const result = walk(item); if (result) return result; }
            } else if (value && typeof value === 'object') {
              const name = value.name || value.database_name || value.databaseName;
              const id = value.uuid || value.database_id || value.databaseId || value.id;
              if (name === target && id) return String(id);
              for (const item of Object.values(value)) { const result = walk(item); if (result) return result; }
            }
            return '';
          };
          process.stdout.write(walk(all));
          NODE
          )"
          test -n "$DB_ID" || { echo "::error::Existing production D1 database was not found; refusing to create or substitute a database."; exit 1; }
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "Found the existing production D1 database; no database creation or reset was performed."

      - name: Verify the dedicated R2 bucket exists (never create or replace it)
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          wrangler r2 bucket list 2>&1 | tee /tmp/r2-list.txt
          if ! grep -Fq "$R2_BUCKET_NAME" /tmp/r2-list.txt; then
            echo "::error::Required existing R2 bucket '$R2_BUCKET_NAME' was not found or could not be listed. Deployment stopped before publishing. Create/verify the bucket in Cloudflare Dashboard first; this workflow never creates storage resources."
            exit 1
          fi
          echo "Found the dedicated R2 bucket '$R2_BUCKET_NAME'. No R2 resource was created or changed."

      - name: Configure the existing production D1 binding
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "yourz-website"
          pages_build_output_dir = "./public"
          compatibility_date = "2026-10-11"
          compatibility_flags = ["nodejs_compat"]
          send_metrics = false

          [[d1_databases]]
          binding = "DB"
          database_name = "yourz-factory-db"
          database_id = "$DB_ID"

          [[r2_buckets]]
          binding = "FILES"
          bucket_name = "$R2_BUCKET_NAME"
          EOF

      - name: Deploy refresh-only build to the existing production branch
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          wrangler pages deploy ./public --project-name "$PROJECT_NAME" --branch main --commit-dirty=true 2>&1 | tee /tmp/yourz-refresh-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9-]+\.yourz-website\.pages\.dev' /tmp/yourz-refresh-deploy.log | tail -n 1)"
          test -n "$DEPLOY_URL" || { echo "::error::Could not resolve the deployed Pages URL."; exit 1; }
          echo "Published to the existing production Pages project: $DEPLOY_URL"
          echo "No custom-domain or DNS API was called."

          HEALTH_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/yourz-health.json --write-out '%{http_code}' -H 'Cache-Control: no-cache' "https://yourz.top/healthz" || true)"
          if [ "$HEALTH_HTTP" != "200" ]; then
            echo "::error::Production health check returned HTTP $HEALTH_HTTP."
            cat /tmp/yourz-health.json 2>/dev/null || true
            exit 1
          fi
          echo "Production health check passed."

          # Validate the immutable deployment URL first, independent of custom-domain edge caches.
          DEPLOY_INDEX_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/deploy-index.html --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$DEPLOY_URL/?v=yourz-refresh-20261016-3-files-20261016-2" || true)"
          DEPLOY_ASSET_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/deploy-app.js --write-out '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$DEPLOY_URL/app.js?v=yourz-refresh-20261016-3-files-20261016-2" || true)"
          node - "$DEPLOY_INDEX_HTTP" /tmp/deploy-index.html "$DEPLOY_ASSET_HTTP" /tmp/deploy-app.js <<'NODE'
          const fs = require('node:fs');
          const indexStatus = process.argv[2];
          const html = fs.readFileSync(process.argv[3], 'utf8');
          const assetStatus = process.argv[4];
          const source = fs.readFileSync(process.argv[5], 'utf8');
          const markers = ['app.js?v=yourz-refresh-20261016-3&safe-import=20261016-1&files-v1=20261016-2'];
          const refreshMarkers = [
            "cache:'no-store'",
            'Loaded latest data / 已载入最新资料',
            "button.setAttribute('aria-busy','true')",
            'Loading latest… / 正在载入…',
            'YOURZ PRODUCT FILE LIBRARY V1',
            'Shared product files / 产品资料文件库',
            'parseXlsxPreview',
            'YOURZ_SUPPLIER_QUOTE_ARCHIVE_V1',
            'YOURZ_XLSX_INLINE_IMAGE_PREVIEW_V1',
            'Supplier quotes & product images'
          ];
          if (indexStatus !== '200' || !markers.every(item => html.includes(item))) {
            console.error('Immutable deployment HTML does not reference the versioned refresh script.');
            process.exit(1);
          }
          if (assetStatus !== '200' || !refreshMarkers.every(item => source.includes(item))) {
            console.error('Immutable deployment asset does not contain the tested refresh behavior.');
            process.exit(1);
          }
          console.log('Immutable production deployment HTML and refresh asset verified.');
          NODE

          # Re-read the custom domain using a versioned URL to avoid the old unversioned app.js cache.
          DOMAIN_INDEX_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/yourz-index.html --write-out '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://yourz.top/?v=yourz-refresh-20261016-3-files-20261016-2" || true)"
          DOMAIN_ASSET_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/yourz-app.js --write-out '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://yourz.top/app.js?v=yourz-refresh-20261016-3-files-20261016-2" || true)"
          node - "$DOMAIN_INDEX_HTTP" /tmp/yourz-index.html "$DOMAIN_ASSET_HTTP" /tmp/yourz-app.js <<'NODE'
          const fs = require('node:fs');
          const indexStatus = process.argv[2];
          const html = fs.readFileSync(process.argv[3], 'utf8');
          const assetStatus = process.argv[4];
          const source = fs.readFileSync(process.argv[5], 'utf8');
          const markers = ['app.js?v=yourz-refresh-20261016-3&safe-import=20261016-1&files-v1=20261016-2'];
          const refreshMarkers = [
            "cache:'no-store'",
            'Loaded latest data / 已载入最新资料',
            "button.setAttribute('aria-busy','true')",
            'Loading latest… / 正在载入…',
            'YOURZ_SUPPLIER_QUOTE_ARCHIVE_V1',
            'YOURZ_XLSX_INLINE_IMAGE_PREVIEW_V1',
            'Supplier quotes & product images'
          ];
          if (indexStatus !== '200' || !markers.every(item => html.includes(item))) {
            console.error('yourz.top HTML does not reference the versioned refresh script yet; deployment not considered verified.');
            process.exit(1);
          }
          if (assetStatus !== '200' || !refreshMarkers.every(item => source.includes(item))) {
            console.error('yourz.top versioned app.js did not return the tested refresh module; deployment not considered verified.');
            process.exit(1);
          }
          console.log('yourz.top versioned refresh asset verified.');
          NODE

          STATE_HTTP="$(curl --silent --show-error --location --max-time 30 --output /tmp/yourz-state.json --write-out '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://yourz.top/api/state" || true)"
          node - "$STATE_HTTP" /tmp/yourz-state.json <<'NODE'
          const fs = require('node:fs');
          const http = process.argv[2];
          const body = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (http !== '200' || !body.state || !Array.isArray(body.state.factories) || !Number.isInteger(body.state.revision)) {
            console.error('Production latest-state API check failed; factory data was not modified by this check.');
            process.exit(1);
          }
          console.log('Production latest-state read passed (revision=' + body.state.revision + ', factory rows=' + body.state.factories.length + ').');
          NODE

      - name: Remove temporary verification files
        if: always()
        run: rm -f /tmp/d1-list.json /tmp/yourz-refresh-deploy.log /tmp/yourz-health.json /tmp/yourz-app.js /tmp/yourz-state.json /tmp/yourz-index.html /tmp/deploy-index.html /tmp/deploy-app.js
