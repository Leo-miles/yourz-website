name: Inspect runtime for IME issue

on:
  push:
    branches:
      - test/ime-runtime-inspection
    paths:
      - .github/workflows/inspect-runtime-ime.yml
      - .github/scripts/fix-chinese-ime.mjs

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Extract runtime and apply IME patch without deploying
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          tar -xJf yourz-runtime.tar.xz -C app
          node .github/scripts/fix-chinese-ime.mjs app/public/app.js
          node --check app/public/app.js
          grep -q "search.addEventListener('compositionstart'" app/public/app.js
          grep -q "if(composing||e.isComposing)return" app/public/app.js
          echo "PASS: runtime patched; JavaScript syntax valid; composition guard present."
          echo "=== patched search handler ==="
          grep -o "const search=document.getElementById('search').*if(search){let composing=false;.*" app/public/app.js | head -c 2500 || true
      - name: Upload patched runtime source for review
        uses: actions/upload-artifact@v4
        with:
          name: ime-runtime-source-patched
          path: |
            app/public/app.js
            app/public/index.html
          if-no-files-found: error
          retention-days: 3
