services:
  app:
    build: .
    container_name: yourz-factory-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/factory.sqlite
      AUTH_MODE: ${AUTH_MODE:-local}
      BASE_URL: ${BASE_URL:?Set BASE_URL in .env}
      LOCAL_ADMIN_USER: ${LOCAL_ADMIN_USER:?Set LOCAL_ADMIN_USER in .env}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?Set LOCAL_ADMIN_PASSWORD in .env}
      TIME_ZONE: ${TIME_ZONE:-Asia/Shanghai}
    volumes:
      - factory_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: caddy:2
    container_name: yourz-factory-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./wecom-verification:/srv/verification:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  factory_data:
  caddy_data:
  caddy_config:
